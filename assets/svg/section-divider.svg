<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 44" width="920" height="44" role="presentation">
  <defs>
    <linearGradient id="vine-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6CA452" stop-opacity="0"/>
      <stop offset="22%" stop-color="#6CA452" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#4E7E36" stop-opacity="0.75"/>
      <stop offset="78%" stop-color="#6CA452" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6CA452" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon-soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9AC67E" stop-opacity="0"/>
      <stop offset="35%" stop-color="#9AC67E" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#9AC67E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9AC67E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes drift-flow { 0% { stroke-dashoffset: 48; } 100% { stroke-dashoffset: 0; } }
    @keyframes sprout-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    .flow-wave { stroke-dasharray: 10 14; animation: drift-flow 4.5s linear infinite; }
    .sprout { transform-box: fill-box; transform-origin: center bottom; animation: sprout-sway 4.4s ease-in-out infinite; }
  </style>

  <!-- Flowing organic contour curves -->
  <path d="M 30 22 Q 140 12 245 22 T 420 22" fill="none" stroke="url(#vine-fade)" stroke-width="1.5"/>
  <path d="M 500 22 Q 610 32 715 22 T 890 22" fill="none" stroke="url(#vine-fade)" stroke-width="1.5"/>
  <path class="flow-wave" d="M 80 22 Q 190 30 300 22 T 420 22" fill="none" stroke="url(#ribbon-soft)" stroke-width="1.4" stroke-linecap="round"/>
  <path class="flow-wave" d="M 500 22 Q 610 14 720 22 T 840 22" fill="none" stroke="url(#ribbon-soft)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Centered Botanical Emblem Pill -->
  <rect x="434" y="7" width="52" height="30" rx="15" fill="#F2F8EE" stroke="#C5DAB9" stroke-width="1.2"/>
  <g class="sprout">
    <path d="M 460 30 L 460 18" stroke="#4E7E36" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 460 22 C 464 13, 474 12, 475 18 C 472 23, 464 23, 460 22 Z" fill="#4E7E36"/>
    <path d="M 460 24 C 455 16, 446 16, 446 21 C 449 25, 456 25, 460 24 Z" fill="#82B665"/>
    <circle cx="460" cy="14.5" r="2" fill="#D69838"/>
  </g>
</svg>
