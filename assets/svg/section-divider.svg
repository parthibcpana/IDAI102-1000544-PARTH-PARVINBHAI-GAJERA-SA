<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 28" width="920" height="28" role="presentation">
  <defs>
    <linearGradient id="rule-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6CA452" stop-opacity="0"/>
      <stop offset="32%" stop-color="#6CA452" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#6CA452" stop-opacity="0.72"/>
      <stop offset="68%" stop-color="#6CA452" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6CA452" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8DC06F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8DC06F" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8DC06F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes scan-pulse {
      0% { transform: translateX(-140px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateX(940px); opacity: 0; }
    }
    @keyframes diamond-breathe { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }
    .scan-beam { animation: scan-pulse 6.5s cubic-bezier(.4,0,.2,1) infinite; }
    .node-core { animation: diamond-breathe 3.6s ease-in-out infinite; }
  </style>

  <line x1="20" y1="14" x2="900" y2="14" stroke="url(#rule-grad)" stroke-width="1.2"/>
  <rect class="scan-beam" x="0" y="13" width="90" height="2" rx="1" fill="url(#pulse-grad)"/>

  <!-- Flanking architectural ticks -->
  <line x1="422" y1="11" x2="422" y2="17" stroke="#6CA452" stroke-opacity="0.48" stroke-width="1.2"/>
  <line x1="498" y1="11" x2="498" y2="17" stroke="#6CA452" stroke-opacity="0.48" stroke-width="1.2"/>
  <line x1="432" y1="14" x2="444" y2="14" stroke="#6CA452" stroke-opacity="0.65" stroke-width="1.2"/>
  <line x1="476" y1="14" x2="488" y2="14" stroke="#6CA452" stroke-opacity="0.65" stroke-width="1.2"/>

  <!-- Geometric leaf diamond core (no AI glow) -->
  <g class="node-core">
    <polygon points="460,5 470,14 460,23 450,14" fill="#18241D" stroke="#6CA452" stroke-width="1.3"/>
    <path d="M 460 8.5 C 462.5 11.2, 463.5 14, 460 19.5 C 456.5 14, 457.5 11.2, 460 8.5 Z" fill="#8DC06F"/>
  </g>
</svg>
