<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="ShopImpact Conscious Shopping Overview">
  <defs>
    <linearGradient id="paper-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFDF7"/>
      <stop offset="100%" stop-color="#EAF3E5"/>
    </linearGradient>
    <linearGradient id="hill-soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9EAC8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B9D9A4" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="card-round">
      <rect width="960" height="320" rx="18"/>
    </clipPath>
  </defs>
  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @keyframes leaf-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @keyframes bar-a { 0%, 10% { transform: scaleX(0.12); } 40%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0.12); } }
    @keyframes bar-b { 0%, 16% { transform: scaleX(0.2); } 48%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0.2); } }
    @keyframes rise { 0% { stroke-dashoffset: 180; } 55%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 180; } }
    .sway { transform-box: fill-box; transform-origin: bottom center; animation: leaf-sway 5s ease-in-out infinite; }
    .ba { transform-box: fill-box; transform-origin: left center; animation: bar-a 8s cubic-bezier(.22,1,.36,1) infinite; }
    .bb { transform-box: fill-box; transform-origin: left center; animation: bar-b 8s cubic-bezier(.22,1,.36,1) infinite; }
    .vine { stroke-dasharray: 180; animation: rise 7s ease-in-out infinite; }
  </style>

  <g clip-path="url(#card-round)">
    <rect width="960" height="320" fill="url(#paper-bg)"/>

    <!-- Soft organic botanical hills on bottom margin -->
    <path d="M 0 278 Q 250 245 520 272 T 960 228 L 960 320 L 0 320 Z" fill="url(#hill-soft)"/>
    <path d="M 460 320 Q 680 250 960 264 L 960 320 Z" fill="#C9E1BA" opacity="0.5"/>

    <!-- Subtle top hairline -->
    <circle cx="44" cy="40" r="4" fill="#4E7E36"/>
    <text x="58" y="44" class="sans" font-size="11.5" font-weight="700" fill="#4E7E36" letter-spacing="1.8">CONSCIOUS SHOPPING COMPANION</text>
    <text x="916" y="44" text-anchor="end" class="sans" font-size="11.5" font-weight="600" fill="#5D7463">Python &amp; Streamlit Studio</text>
    <line x1="40" y1="62" x2="920" y2="62" stroke="#D3E2CB" stroke-width="1"/>

    <!-- Left Editorial Narrative -->
    <text x="40" y="106" class="serif" font-size="30" font-weight="700" fill="#13261B">Every price tag tells half the story.</text>
    <text x="40" y="142" class="serif" font-size="30" font-weight="700" fill="#4E7E36">ShopImpact reveals the carbon cost.</text>

    <text x="40" y="182" class="sans" font-size="14" fill="#3D5544">Track the hidden CO₂ footprint behind clothing, food, and tech in real time,</text>
    <text x="40" y="203" class="sans" font-size="14" fill="#3D5544">discover practical circular brand swaps, and grow botanical Turtle art with</text>
    <text x="40" y="224" class="sans" font-size="14" fill="#3D5544">every mindful habit inside a calm, private workspace.</text>

    <!-- Soft warm pills -->
    <g font-size="11.5" font-weight="600" class="sans">
      <rect x="40" y="254" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#CFE0C6"/>
      <text x="96" y="272" text-anchor="middle" fill="#294832">9 Categories</text>

      <rect x="162" y="254" width="142" height="28" rx="14" fill="#DCEBD4" stroke="#BBD6AE"/>
      <text x="233" y="272" text-anchor="middle" fill="#2A5120">30% Circular Credit</text>

      <rect x="314" y="254" width="136" height="28" rx="14" fill="#FFFFFF" stroke="#CFE0C6"/>
      <text x="382" y="272" text-anchor="middle" fill="#294832">5 Eco Mascots</text>
    </g>

    <!-- Right Clean Organic Comparison Card -->
    <rect x="576" y="84" width="344" height="202" rx="16" fill="#FFFFFF" stroke="#D2E2CA" stroke-width="1.2"/>
    <text x="600" y="110" class="sans" font-size="11" font-weight="700" fill="#5D7463" letter-spacing="1.2">EVERYDAY IMPACT COMPARISON</text>

    <!-- Choice A -->
    <text x="600" y="140" class="sans" font-size="12.5" font-weight="700" fill="#13261B">New Leather Footwear ($130)</text>
    <text x="896" y="140" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#B54D3E">84.5 kg CO₂</text>
    <rect x="600" y="148" width="296" height="10" rx="5" fill="#F2E9E6"/>
    <rect class="ba" x="600" y="148" width="240" height="10" rx="5" fill="#C45B4D"/>

    <!-- Choice B -->
    <text x="600" y="184" class="sans" font-size="12.5" font-weight="700" fill="#13261B">Thrifted Denim Jacket ($32)</text>
    <text x="896" y="184" text-anchor="end" class="sans" font-size="12.5" font-weight="700" fill="#3F6E2C">1.12 kg CO₂</text>
    <rect x="600" y="192" width="296" height="10" rx="5" fill="#E9F2E4"/>
    <rect class="bb" x="600" y="192" width="28" height="10" rx="5" fill="#4E7E36"/>

    <!-- Gentle Botanical Branch Accent -->
    <line x1="600" y1="224" x2="896" y2="224" stroke="#E8F0E3" stroke-width="1"/>
    <path class="vine" d="M 604 264 Q 645 244 686 260 T 764 252" fill="none" stroke="#6CA452" stroke-width="2" stroke-linecap="round"/>
    <g class="sway">
      <path d="M 764 252 C 769 240, 782 238, 786 248 C 779 255, 769 255, 764 252 Z" fill="#6CA452"/>
      <path d="M 764 252 C 756 242, 745 243, 744 251 C 750 256, 758 255, 764 252 Z" fill="#9AC67E"/>
    </g>
    <text x="896" y="259" text-anchor="end" class="sans" font-size="12" font-weight="700" fill="#4E7E36">98% carbon cut via swap</text>
  </g>
  <rect x="0.75" y="0.75" width="958.5" height="318.5" rx="18" fill="none" stroke="#CBE0C1" stroke-width="1.5"/>
</svg>
