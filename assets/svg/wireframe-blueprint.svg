<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" width="920" height="265" role="img" aria-label="ShopImpact Three-Screen UI Wireframe Blueprint">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <rect width="920" height="265" rx="12" fill="#121B16" stroke="#2B4434" stroke-width="1"/>
  <text x="20" y="24" class="mono" font-size="10.5" fill="#8DC06F" letter-spacing="1.2">UI ARCHITECTURE WIREFRAME // THREE INTERCONNECTED VIEWS</text>

  <!-- Screen 1: Onboarding -->
  <rect x="20" y="40" width="276" height="205" rx="8" fill="#17231C" stroke="#365340" stroke-width="1.2"/>
  <text x="32" y="59" class="mono" font-size="10" fill="#ECF3EA">SCREEN 1: ONBOARDING GATEWAY</text>
  <rect x="32" y="68" width="252" height="44" rx="5" fill="#1E3125" stroke="#4E7E36" stroke-dasharray="3 3"/>
  <text x="158" y="94" text-anchor="middle" class="sans" font-size="10.5" fill="#8DC06F">Animated Botanical SVG Horizon</text>
  <rect x="32" y="122" width="142" height="110" rx="5" fill="#1B2A21" stroke="#2F4938"/>
  <text x="42" y="141" class="sans" font-size="10" font-weight="700" fill="#ECF3EA">Shopper Inputs</text>
  <rect x="42" y="150" width="122" height="16" rx="3" fill="#24362B"/>
  <rect x="42" y="172" width="122" height="16" rx="3" fill="#24362B"/>
  <rect x="42" y="194" width="122" height="12" rx="3" fill="#24362B"/>
  <rect x="42" y="212" width="122" height="14" rx="7" fill="#4E7E36"/>
  <rect x="184" y="122" width="100" height="110" rx="5" fill="#1B2A21" stroke="#2F4938"/>
  <circle cx="234" cy="160" r="22" fill="#24382C" stroke="#6CA452"/>
  <text x="234" y="200" text-anchor="middle" class="sans" font-size="9.5" fill="#A3B9A9">Live Mascot</text>
  <text x="234" y="213" text-anchor="middle" class="sans" font-size="9.5" fill="#A3B9A9">Preview</text>

  <!-- Screen 2: Main Studio -->
  <rect x="314" y="40" width="320" height="205" rx="8" fill="#17231C" stroke="#4E7E36" stroke-width="1.4"/>
  <text x="326" y="59" class="mono" font-size="10" fill="#ECF3EA">SCREEN 2: COMMAND STUDIO</text>
  <!-- Sidebar strip -->
  <rect x="324" y="68" width="58" height="164" rx="4" fill="#141F19" stroke="#2F4938"/>
  <circle cx="353" cy="88" r="11" fill="#24382C" stroke="#6CA452"/>
  <rect x="332" y="108" width="42" height="12" rx="3" fill="#24362B"/>
  <rect x="332" y="126" width="42" height="12" rx="3" fill="#24362B"/>
  <rect x="332" y="150" width="42" height="8" rx="4" fill="#4E7E36"/>
  <rect x="332" y="210" width="42" height="14" rx="4" fill="#2C2416" stroke="#D69838" stroke-width="0.6"/>
  <!-- Header + 3 equal height panels -->
  <rect x="390" y="68" width="234" height="18" rx="4" fill="#1B2A21" stroke="#2F4938"/>
  <rect x="558" y="71" width="60" height="12" rx="6" fill="#4E7E36"/>
  <rect x="390" y="92" width="74" height="58" rx="5" fill="#1B2A21" stroke="#365340"/>
  <text x="427" y="124" text-anchor="middle" class="sans" font-size="9" fill="#A3B9A9">Biosphere</text>
  <rect x="470" y="92" width="74" height="58" rx="5" fill="#1B2A21" stroke="#365340"/>
  <text x="507" y="124" text-anchor="middle" class="sans" font-size="9" fill="#A3B9A9">Companion</text>
  <rect x="550" y="92" width="74" height="58" rx="5" fill="#1B2A21" stroke="#365340"/>
  <text x="587" y="124" text-anchor="middle" class="sans" font-size="9" fill="#A3B9A9">Turtle Art</text>
  <!-- KPIs + Chips + Ledger -->
  <rect x="390" y="156" width="54" height="22" rx="4" fill="#203227"/>
  <rect x="450" y="156" width="54" height="22" rx="4" fill="#203227"/>
  <rect x="510" y="156" width="54" height="22" rx="4" fill="#203227"/>
  <rect x="570" y="156" width="54" height="22" rx="4" fill="#203227"/>
  <rect x="390" y="184" width="234" height="16" rx="3" fill="#203227"/>
  <rect x="390" y="205" width="113" height="27" rx="4" fill="#1B2A21" stroke="#2F4938"/>
  <rect x="511" y="205" width="113" height="27" rx="4" fill="#1B2A21" stroke="#2F4938"/>

  <!-- Screen 3: Wall of Badges -->
  <rect x="652" y="40" width="248" height="205" rx="8" fill="#17231C" stroke="#365340" stroke-width="1.2"/>
  <text x="664" y="59" class="mono" font-size="10" fill="#ECF3EA">SCREEN 3: BADGES &amp; VAULT</text>
  <rect x="664" y="68" width="108" height="36" rx="5" fill="#2E5124" stroke="#6CA452"/>
  <rect x="780" y="68" width="108" height="36" rx="5" fill="#2E5124" stroke="#6CA452"/>
  <rect x="664" y="110" width="108" height="36" rx="5" fill="#2E5124" stroke="#6CA452"/>
  <rect x="780" y="110" width="108" height="36" rx="5" fill="#1D2B22" stroke="#365340" stroke-dasharray="3 2"/>
  <text x="664" y="168" class="mono" font-size="9.5" fill="#8DC06F">TURTLE ART VAULT (4x)</text>
  <rect x="664" y="176" width="51" height="56" rx="5" fill="#1B2A21" stroke="#4E7E36"/>
  <rect x="720" y="176" width="51" height="56" rx="5" fill="#1B2A21" stroke="#4E7E36"/>
  <rect x="776" y="176" width="51" height="56" rx="5" fill="#1B2A21" stroke="#4E7E36"/>
  <rect x="832" y="176" width="51" height="56" rx="5" fill="#1B2A21" stroke="#4E7E36"/>
</svg>
