<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 215" width="920" height="215" role="img" aria-label="How ShopImpact Calculates and Updates Every Purchase">
  <defs>
    <linearGradient id="pipe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFDF7"/>
      <stop offset="100%" stop-color="#EEF5E9"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .wire { stroke-dasharray: 6 6; animation: flow 1.6s linear infinite; }
  </style>

  <rect width="920" height="215" rx="16" fill="url(#pipe-bg)" stroke="#CFE0C6" stroke-width="1.2"/>
  <text x="26" y="28" class="sans" font-size="11" font-weight="700" fill="#4E7E36" letter-spacing="1.4">HOW EVERY LOGGED PURCHASE FLOWS THROUGH PYTHON</text>

  <!-- Step 1 -->
  <rect x="24" y="72" width="166" height="76" rx="12" fill="#FFFFFF" stroke="#CFE0C6" stroke-width="1.2"/>
  <text x="38" y="95" class="sans" font-size="10.5" font-weight="700" fill="#4E7E36">1. INPUT</text>
  <text x="38" y="116" class="sans" font-size="13.5" font-weight="700" fill="#13261B">Purchase Logged</text>
  <text x="38" y="135" class="sans" font-size="11.5" fill="#526859">Chip, Modal, or Form</text>

  <!-- Step 2 -->
  <rect x="226" y="72" width="184" height="76" rx="12" fill="#FFFFFF" stroke="#9AC67E" stroke-width="1.5"/>
  <text x="240" y="95" class="sans" font-size="10.5" font-weight="700" fill="#4E7E36">2. CARBON MATH</text>
  <text x="240" y="116" class="sans" font-size="13.5" font-weight="700" fill="#13261B">calculate_carbon()</text>
  <text x="240" y="135" class="sans" font-size="11.5" fill="#526859">30% off circular buys</text>

  <!-- Step 3 -->
  <rect x="446" y="72" width="184" height="76" rx="12" fill="#FFFFFF" stroke="#CFE0C6" stroke-width="1.2"/>
  <text x="460" y="95" class="sans" font-size="10.5" font-weight="700" fill="#B07514">3. SESSION LIST</text>
  <text x="460" y="116" class="sans" font-size="13.5" font-weight="700" fill="#13261B">purchases.append()</text>
  <text x="460" y="135" class="sans" font-size="11.5" fill="#526859">Saved in session state</text>

  <!-- Outputs -->
  <rect x="670" y="42" width="226" height="46" rx="10" fill="#FFFFFF" stroke="#CFE0C6" stroke-width="1.2"/>
  <text x="686" y="62" class="sans" font-size="12.5" font-weight="700" fill="#13261B">Dashboard &amp; Altair Charts</text>
  <text x="686" y="78" class="sans" font-size="11" fill="#526859">Spend, CO₂, trees &amp; ledger</text>

  <rect x="670" y="97" width="226" height="46" rx="10" fill="#FFFFFF" stroke="#CFE0C6" stroke-width="1.2"/>
  <text x="686" y="117" class="sans" font-size="12.5" font-weight="700" fill="#13261B">Badges &amp; Swap Optimizer</text>
  <text x="686" y="133" class="sans" font-size="11" fill="#526859">Unlocks + 1-click green swap</text>

  <rect x="670" y="152" width="226" height="46" rx="10" fill="#EAF4E4" stroke="#8FBE74" stroke-width="1.3"/>
  <text x="686" y="172" class="sans" font-size="12.5" font-weight="700" fill="#2A5120">HeadlessTurtle &amp; Mascot</text>
  <text x="686" y="188" class="sans" font-size="11" fill="#466549">280x280 botanical art + mood</text>

  <!-- Flowing organic connectors -->
  <line class="wire" x1="190" y1="110" x2="226" y2="110" stroke="#4E7E36" stroke-width="2"/>
  <line class="wire" x1="410" y1="110" x2="446" y2="110" stroke="#4E7E36" stroke-width="2"/>
  <path class="wire" d="M 630 100 L 650 100 L 650 65 L 670 65" fill="none" stroke="#4E7E36" stroke-width="1.8"/>
  <line class="wire" x1="630" y1="120" x2="670" y2="120" stroke="#D69838" stroke-width="1.8"/>
  <path class="wire" d="M 630 132 L 650 132 L 650 175 L 670 175" fill="none" stroke="#6CA452" stroke-width="1.8"/>
</svg>
